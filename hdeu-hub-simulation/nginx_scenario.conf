worker_processes 1;
# error_log /dev/stderr debug;

events {
  worker_connections 1024;
}

http {
    # DNS resolver for runtime hostname resolution
    resolver ${RESOLVER} valid=10s ipv6=off;

    server {
        listen ${WEB_PORT} ssl;
        server_name ${SERVER_NAME};

        # TLS certificates
        ssl_certificate /etc/nginx/certs/healthdata-local.com.cert;
        ssl_certificate_key /etc/nginx/certs/healthdata-local.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;


        location = /routable {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # location /catalogue-statistics/api/ {
        #   proxy_pass http://hdeu-hub-statistics:9090/;
        # }

        location / {
            set $upstream hdeu-hub-ui:8080;
            proxy_pass http://$upstream;
        }

        location /hub/api/store/ {
            set $upstream hdeu-hub-store:8080;
            rewrite ^/hub/api/store(/.*)$ $1 break;
            proxy_pass http://$upstream;
        }

        location /hub/api/search/ {
            set $upstream hdeu-hub-search:8080;
            rewrite ^/hub/api/search(/.*)$ $1 break;
            proxy_pass http://$upstream;
        }

        location /hub/api/repo/ {
            set $upstream hdeu-hub-repo:8080;
            rewrite ^/hub/api/repo(/.*)$ $1 break;
            proxy_pass http://$upstream;
        }

        # WebSocket endpoint for real-time section lock events (lock_acquired / lock_released).
        # Uses ^~ so nginx selects this block for any /healthData/api/ws/ request without
        # needing to check further regex rules — order in this file does not matter.
        location ^~ /healthData/api/ws/ {
            set $upstream hdeu-access:8080;
            rewrite ^/healthData/api/ws(/.*)$ $1 break;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keep WS connections alive; backend heartbeat keeps individual locks refreshed
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # All other health-data-access REST traffic
        location ^~ /healthData/ {
            client_max_body_size 6M;
            set $upstream hdeu-access:8080;
            rewrite ^/healthData(/.*)$ $1 break;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            set $upstream hdeu-auth:8080;
            rewrite ^/auth(/.*)$ $1 break;
            proxy_pass http://$upstream;
        }

        location /api/virtuoso/ {
            set $upstream virtuoso:8890;
            rewrite ^/api/virtuoso(/.*)$ $1 break;
            proxy_pass http://$upstream;
        }

        location /keycloak/ {
            set $upstream keycloak:8080;
            proxy_pass http://$upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
