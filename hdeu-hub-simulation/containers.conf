## Podman uses a copy of host /etc/hosts when creating the file in containers, which is a problem if the healthdata server name is added there. The same name is used as an alias for the proxy service so that auth and access services can route their communication (to webcloak). The /etc/hosts definition will override the container dns resolution for the alias and as such kills the backchannel communication for token validation. This config swaps a minimal hosts file as the basis for the container hosts to sidestep the above problem.

[containers]
base_hosts_file = "./minimal_hosts"
