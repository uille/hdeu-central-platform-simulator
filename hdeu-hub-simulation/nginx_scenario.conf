worker_processes 1;

events {
  worker_connections 1024;
}

http {
  server {
    listen 8092;
    server_name ${SERVER_NAME};

    # location /catalogue-statistics/api/ {
    #   proxy_pass http://hdeu-hub-statistics:9090/;
    # }
    
    location / {
      proxy_pass http://hdeu-hub-ui:8080/;
    }

    location /hub/api/store/ {
      proxy_pass http://hdeu-hub-store:8080/;
    }
    
    location /hub/api/search/ {
      proxy_pass http://hdeu-hub-search:8080/;
    }

    location /hub/api/repo/ {
      proxy_pass http://hdeu-hub-repo:8080/;
    }

    # WebSocket endpoint for real-time section lock events (lock_acquired / lock_released).
    # Uses ^~ so nginx selects this block for any /healthData/api/ws/ request without
    # needing to check further regex rules — order in this file does not matter.
    location ^~ /healthData/api/ws/ {
      proxy_pass http://hdeu-access:8080/api/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Keep WS connections alive; backend heartbeat keeps individual locks refreshed
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # All other health-data-access REST traffic
    location ^~ /healthData/ {
      client_max_body_size 6M;
      proxy_pass http://hdeu-access:8080/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
      proxy_pass http://hdeu-auth:8080/;
    }

    location /api/virtuoso/ {
      proxy_pass http://virtuoso:8890/;
    }

    location /keycloak/ {
      proxy_pass http://keycloak:8080/keycloak/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
    }

  }
}
