      - TRANSLATION_SERVICE_URL=http://translation-stub:8084/translation-service
      - TRANSLATION_SERVICE_FILE_URL=http://translation-stub:8084/file-translation-service
      - TRANSLATION_SERVICE_CALLBACK_URL=http://hdeu-access:8080/translation
      - TRANSLATION_SERVICE_X_API_KEY=bc6dba36-e87e-4c27-95ba-ff3777acc703
      - TRANSLATION_RETRY_INTERVAL=18000000
      - TRANSLATION_RETRY_MAX_ATTEMPTS=3
      - CONTROLLED_VOCABULARY_REFRESH_INTERVAL=60000
