      - VITE_API_SPARQL_URL=${VITE_API_SPARQL_URL:?}
      
      - VITE_API_GAZETTEER_BASE_URL=${VITE_API_GAZETTEER_BASE_URL:-https://data.europa.eu/api/hub/search/gazetteer/}
      - VITE_API_CATALOG_BASE_URL=${VITE_API_CATALOG_BASE_URL:-https://europeandataportal.eu/}
      
      - VITE_API_CORSPROXY_API_URL=${VITE_API_CORSPROXY_API_URL:?}
      - VITE_DATA_ACCESS_URL=${VITE_DATA_ACCESS_URL:?}
      - VITE_DATA_AUTH_URL=${VITE_DATA_AUTH_URL:?}
      - VITE_STATISTICS_URL=${VITE_STATISTICS_URL:?}
      - VITE_DS_DETAILS_CODE_VALUES_CUTOFF=1
      - VITE_LOCK_INACTIVITY_WARNING_MS=${VITE_LOCK_INACTIVITY_WARNING_MS:-1800000}
#     The below property is the drupal cms address used to fetch premade content for the hub ui
#      You can either keep the acceptance url in order to have the premade content available
#      or point it to your local drupal instance to work with custom content
      - VITE_API_DRUPAL_URL_ACCEPTANCE=https://health-data-drupal.acceptance.data.health.europa.eu/
#     - VITE_API_DRUPAL_URL_ACCEPTANCE=http://localhost:8087/
      - VITE_API_DRUPAL_VISIBILITY_FLAG=true
    depends_on:
      hdeu-hub-repo:
        condition: service_started
      keycloak-startup-gate:
        condition: service_completed_successfully
    networks:
      ui-search-nw: {}
      ui-repo-nw: {}
      ui-virtuoso-nw: {}
      ui-data-upload-nw: {}
      proxy-ui-nw: {}

  hdeu-hub-search:
    image: hdeu-hub-search:latest
    logging:
      options:
        max-size: "50m"
    container_name: hdeu-hub-search
    build:
      context: ../hdeu-hub-search # the location of the Dockerfile for the project (local f/s where the project is cloned)
    volumes:
      - ./hub-search/conf:/usr/verticles/conf
    networks:
      elastic-nw: {}
      search-repo-nw: {}
      ui-search-nw: {}
      search-statistic-nw: {}
      proxy-ui-nw: {}
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms300m -Xmx1g -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
    ports:
      - "8082:8080"
      - "8083:8081"
      - "5007:5007" # debug port

  hdeu-hub-store:
    image: hdeu-hub-store:latest
    container_name: hdeu-hub-store
    build: ../hdeu-hub-store # the location of the Dockerfile for the project (local f/s where the project is cloned)
    logging:
      options:
        max-size: "50m"
    networks:
      mongo-nw: {}
      data-upload-repo-nw: {}
      ui-data-upload-nw: {}
      proxy-ui-nw: {}
    depends_on:
      - mongodb
    volumes:
      - hub_data_upload:/usr/verticles/simplestore
    environment:
