    container_name: hdeu-auth
    build: ../hdeu-auth # the location of the Dockerfile for the project (local f/s where the project is cloned)
    logging:
      options:
        max-size: "50m"
    networks:
      ui-repo-nw: {}
      proxy-ui-nw: {}
    environment:
