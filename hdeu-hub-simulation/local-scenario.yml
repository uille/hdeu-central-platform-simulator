  keycloak:
    image: quay.io/keycloak/keycloak:22.0.4
    container_name: keycloak
    command: start-dev --import-realm # imports the healthdata realm
    user: "${UID}:${GID}"
    ports:
      - "10000:8080"
    networks:
      ui-repo-nw: {}
      proxy-ui-nw: {}
    volumes:
      - ./keycloak/data:/opt/keycloak/data
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_FEATURES=token-exchange,admin-fine-grained-authz
      - KC_LOG_LEVEL=INFO
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HOSTNAME=${WEB_HOST} #required for redirect uri matching
      - KC_HTTP_RELATIVE_PATH=/keycloak
      - KC_PROXY=edge
      - KC_PROXY_HEADERS=xforwarded
      - KC_LOG_LEVEL=info

  keycloak-startup-gate:
    image: curlimages/curl:latest
    container_name: keycloak-startup-gate
    networks:
      proxy-ui-nw: {}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        ENDPOINTS="http://keycloak:9000/health/ready
        http://keycloak:8080/keycloak/realms/healthdata/.well-known/openid-configuration
        http://keycloak:8080/keycloak/realms/healthdata/protocol/openid-connect/certs"

        echo "Waiting for Keycloak readiness..."

        for endpoint in $ENDPOINTS; do
          until curl --fail --silent --output /dev/null --max-time 5 "$endpoint"; do
            echo "Endpoint not ready: $endpoint"
            sleep 2
          done
        done

        echo "All Keycloak endpoints are ready."
    restart: "no"


volumes:
  opensearch_data:
  mongo_data:
  virtuoso:
  shadow-virtuoso:
  pgadmin_data:
  pg_data:
  hub_data_upload: