      - KEYCLOAK_REALM_ENDPOINT=${KEYCLOAK_DOCKER_ADDRESS}/realms/healthdata
      - KEYCLOAK_ADDRESS=${KEYCLOAK_DOCKER_ADDRESS}
      - KEYCLOAK_REALM_NAME=healthdata
      - KEYCLOAK_MASTER_REALM_ENDPOINT=${KEYCLOAK_DOCKER_ADDRESS}/realms/master
      - KEYCLOAK_TOKEN_PATH=/protocol/openid-connect/token
      - KEYCLOAK_INTROSPECT_PATH=/protocol/openid-connect/token/introspect
      - KEYCLOAK_CLIENT_ID=eu-login-client
      - KEYCLOAK_CLIENT_SECRET=HCOZDh8XP2cDBuyidDDnqdFrL2haM31s
      - KEYCLOAK_SUBJECT_ISSUER=eulogin-aws
      - KEYCLOAK_REDIRECT_URI=${HEALTHDATA_SERVER_NAME}
      - KEYCLOAK_USER_DELETE_PATH=${KEYCLOAK_DOCKER_ADDRESS}/admin/realms/healthdata/users/
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - EULOGIN_CLIENT_ID=
      - EULOGIN_CLIENT_SECRET=
      - EULOGIN_AUTHORIZE_ENDPOINT=${EU_LOGIN_SERVER_ADDRESS}/cas/oauth2/authorize
      - EULOGIN_LOGOUT_ENDPOINT=${EU_LOGIN_SERVER_ADDRESS}/cas/logout
      - EULOGIN_LOGOUT_REDIRECT_URI=${HEALTHDATA_SERVER_NAME}/auth/api/logout
      - EULOGIN_TOKEN_ENDPOINT=${EU_LOGIN_SERVER_ADDRESS}/cas/oauth2/token
      - EULOGIN_REDIRECT_URI=${EULOGIN_REDIRECT_URI}
      - ACCESS_COOKIE_SECURE=${HEALTHDATA_ACCESS_COOKIE_SECURE}
      - COOKIES_DOMAIN=${HEALTHDATA_COOKIES_DOMAIN}
      - IS_DEV_MODE=true # Set to true to enable dev mode and enable only keycloak login
    ports:
      - "8086:8080"
      - "5010:5010" # debug port
   
  opensearch:
    image: opensearchproject/opensearch:1.3.20
    container_name: opensearch
    environment:
      - cluster.name=opensearch-cluster
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - indices.query.bool.max_clause_count=8192
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      elastic-nw: {}
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:1.3.20
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    networks:
      elastic-nw: {}

  mongodb:
    image: mongo:5.0
    container_name: mongodb
    logging:
      options:
        max-size: "50m"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      mongo-nw: {}
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoAdmin
      - MONGO_INITDB_ROOT_PASSWORD=mongoSecret123!

  virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.16
    container_name: virtuoso
    logging:
      options:
        max-size: "50m"
    ports:
      - "8890:8890"
      - "1111:1111"
    networks:
      virtuoso-repo-nw: {}
      ui-virtuoso-nw: {}
      proxy-ui-nw: {}
    volumes:
      - virtuoso:/usr/local/virtuoso-opensource/var/lib/virtuoso/db
    environment:
      - DBA_PASSWORD=dba

  shadow-virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.16
    container_name: shadow-virtuoso
    logging:
      options:
        max-size: "50m"
    ports:
      - "9890:8890"
      - "9111:1111"
    networks:
      virtuoso-repo-nw: {}
    volumes:
      - shadow-virtuoso:/usr/local/virtuoso-opensource/var/lib/virtuoso/db
    environment:
      - DBA_PASSWORD=dba

