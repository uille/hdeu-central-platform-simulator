version: '3.9'
name: healthdata
networks:
  elastic-nw:
    name: elastic-network
  mongo-nw:
    name: mongo-network
  virtuoso-repo-nw:
    name: virtuoso-repo-network
  search-repo-nw:
    name: search-repo-network
  data-upload-repo-nw:
    name: data-upload-network
  ui-search-nw:
    name: ui-search-network
  ui-repo-nw:
    name: ui-repo-network
  ui-virtuoso-nw:
    name: "ui-virtuoso-network"
  ui-data-upload-nw:
    name: "ui-data-upload-network"
  # statistic-db-nw:
  #   name: "statistic-db-network"
  search-statistic-nw:
    name: "search-statistic-network"
  # statistics-ui-nw:
  #   name: "statistics-ui-network"
  proxy-ui-nw:
    name: "proxy-ui-network"
  # domibus-europe_cross-country-network:
  #   external: true
  # needs to be created manually unless domibus compose files (under /domibus) are started:
  # docker network create domibus-europe_cross-country-network

services:
  reverse-proxy:
    image: reverse-proxy:latest
    container_name: httpd-proxy
    build:
      context: .
      dockerfile: Dockerfile_scenario
    ports:
      - '${WEB_PORT}:${WEB_PORT}'
    environment:
      - SERVER_NAME=${WEB_HOST_NAME}
      - WEB_PORT=${WEB_PORT}
    cap_add:
      - NET_RAW
    networks:
      proxy-ui-nw:
        aliases:
          - ${WEB_HOST_NAME} # This is the server name used in the reverse proxy and is needed for keycloak to work properly with health-data-auth

  proxy-startup-gate:
    image: curlimages/curl:latest
    container_name: proxy-startup-gate
    depends_on:
      reverse-proxy:
        condition: service_started
    environment:
      WEB_HOST_NAME: ${WEB_HOST_NAME}
      WEB_PORT: ${WEB_PORT}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        until curl --silent --fail --output /dev/null \
          --max-time 3 \
          "http://$${WEB_HOST_NAME}:$${WEB_PORT}/routable"
        do
          echo "Waiting for the reverse-proxy route to become available..."
          sleep 2
        done

        echo "Reverse-proxy route is available."
    restart: "no"

  hdeu-hub-repo:
    image: hdeu-hub-repo:latest
    logging:
      options:
        max-size: "50m"
    container_name: hdeu-hub-repo
    build:
      context: ../hdeu-hub-repo # the locatfion of the Dockerfile for the project (local f/s where the project is cloned)
    ports:
      - "9080:8080"
      - "5006:5006" # debug port
    volumes:
      - ./hub-repo/conf/config.json:/usr/verticles/conf/config.json
      - ./hub-repo/profiles/healthdcatap:/usr/verticles/profiles/healthdcatap
    environment:
      - JAVA_OPTS=-Xms300m -Xmx1g -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
      - HUB_REPO_API_KEY=7c6a7c98-20e1-4915-ba0c-985b6724560b
      - HUB_SEARCH_SERVICE_API_KEY=a92b814f-63f8-4a5d-abc7-8710de0d2e86
      - HUB_SEARCH_SERVICE_URL=hdeu-hub-search
      - HUB_SEARCH_SERVICE_PORT=8080
      - TRANSLATION_SERVICE_API_KEY=bc6dba36-e87e-4c27-95ba-ff3777acc703
      - TRANSLATION_SERVICE_URL=http://hdeu-hub-translation:8080/translation-service
      - TRANSLATION_SERVICE_CALLBACK_URL=http://hdeu-hub-repo:8080/translation
      - HUB_STORE_DATA_UPLOAD_URL=http://hdeu-hub-store:8080
      - HUB_STORE_DATA_UPLOAD_SERVICE_URL=http://hdeu-hub-store:8080
      - HUB_STORE_DATA_UPLOAD_API_KEY=0e3296cb-5106-4d77-9e9d-25ef9b6eac71
      - VIRTUOSO_CONFIG_URL=http://virtuoso:8890
      - VIRTUOSO_CONFIG_USER=dba
      - VIRTUOSO_CONFIG_PASS=dba
      - SHADOW_VIRTUOSO_CONFIG_URL=http://shadow-virtuoso:8890
      - SHADOW_VIRTUOSO_CONFIG_USER=dba
      - SHADOW_VIRTUOSO_CONFIG_PASS=dba
      - ITB_VALIDATOR_ENDPOINT=https://health-data-itb-rdf-validator.acceptance.data.health.europa.eu/shacl/ehds/api/validate
    depends_on:
      - hdeu-hub-search
      - hdeu-hub-store
      - virtuoso
      - shadow-virtuoso
    networks:
      virtuoso-repo-nw: {}
      search-repo-nw: {}
      data-upload-repo-nw: {}
      ui-repo-nw: {}
      proxy-ui-nw: {}

