  # Stub Translation Service - replaces hdeu-hub-translation in translation-disabled deployments
  translation-stub:
    image: translation-stub:latest
    container_name: translation-stub
    build:
      context: ../hdeu-translation-stub
      dockerfile: Dockerfile
    logging:
      options:
        max-size: "50m"
    ports:
      - "8084:8084"
    environment:
      - STUB_API_KEY=c0107b96-78a1-408e-b05f-a65eb3a3d0a8
    networks:
      - mongo-nw
      - ui-repo-nw
