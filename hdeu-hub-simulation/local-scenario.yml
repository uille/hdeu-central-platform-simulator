      - HUB_SEARCH_DATA_URL=http://hdeu-hub-search:8080
      - EXPORT_DATA_ACCESS_API_KEY=0e3296cb-5106-4d77-9e9d-25ef9b6eac71gv
      - ITB_VALIDATOR_ENDPOINT=https://health-data-itb-rdf-validator.acceptance.data.health.europa.eu/shacl/ehds/api/validate
      - OUTGOING_APPLICATION_ACTIVITIES_INTERVAL=60000
      - OUTGOING_APPLICATION_ACTIVITIES_ENABLE=0 # 0 here disables sending "DRAFT" applications to Dispatcher
      - WITHDRAW_RUN_TIME=06:00
      - WITHDRAW_THRESHOLD_DAYS=28
      - ADDITIONAL_INFO_WITHDRAW_THRESHOLD_DAYS=28
      - MAIL_SERVICE_BASE_URL=http://hdeu-mail:1025
      - MAIL_SERVICE_X_API_KEY=c3b8b49e-9f4b-4c44-8c3b-6b7e56e0c5e3
      - MAIL_APPLICATIONS_BASE_URL=http://healthdata-local.com/healthdata-central-platform/
      - EXPIRATION_DAYS=90
      - DECISION_TRANSLATION_INTERVAL=30000
      - DECISION_SYNC_INTERVAL=30000
      - ENABLE_TRANSLATION=true
    ports:
      - "8085:8080"
      - "5005:5005" # debug port
    restart: on-failure

  hdeu-mail:
    image: hdeu-mail:latest
    container_name: hdeu-mail
    logging:
      options:
        max-size: "50m"
    networks:
      mongo-nw: {}
      proxy-ui-nw: {}
    build: ../hdeu-email # the location of the Dockerfile for the project (local f/s where the project is cloned)
    depends_on:
      mongodb:
        condition: service_started
    environment:
      - JAVA_OPTS=-Xms300m -Xmx1g -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5011
      - MONGO_DB_URI=mongodb://mongoAdmin:mongoSecret123!@mongodb:27017/?authSource=admin
      - MONGO_DB=healthData-mailServerDB
      - HTTP_PORT=1025
      - EMAIL_SERVER_API_KEY=c3b8b49e-9f4b-4c44-8c3b-6b7e56e0c5e3
      # Email mode:
      # - none (default): disable sending
      # - smtp: use SMTP (MailHog locally or real SMTP if configured)
      # - rest: CNS REST API
      - EMAIL_MODE=${EMAIL_MODE:-none}
      - EMAIL_BASE_URL=https://webgate.acceptance.ec.europa.eu/cns/services/rest/v1
      - EMAIL_API_KEY=${MAIL_API_KEY}
      - EMAIL_API_KEY_VALUE=${MAIL_API_KEY_VALUE}
      - EMAIL_NOTIFICATION_GROUP=${EMAIL_NOTIFICATION_GROUP}
      - CREATE_MESSAGE_SCHEDULER_ENABLE=1
      - CREATE_MESSAGE_SCHEDULER_INTERVAL=6000
      - MAIL_MAX_RETRIES=10
      # SMTP configuration (used only when EMAIL_MODE=smtp)
      - MAIL_ASSETS_BASE_URL=http://healthdata-local.com/mail-assets
      - MAIL_DEFAULT_PREFERENCES_LINK=http://healthdata-local.com/healthdata-central-platform/userProfilePanel?tab=audit
      - MAIL_DEFAULT_SUPPORT_EMAIL=${MAIL_DEFAULT_SUPPORT_EMAIL}
      # SMTP server config
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-smtp.gmail.com}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-587}
      - MAIL_SMTP_USERNAME=${MAIL_SMTP_USERNAME}
      - MAIL_SMTP_PASSWORD=${MAIL_SMTP_PASSWORD}
      - MAIL_SMTP_STARTTLS=true
      - MAIL_SMTP_SSL=false
      - MAIL_SMTP_FROM=${MAIL_SMTP_FROM:-${MAIL_SMTP_USERNAME}}
    ports:
      - "1025:1025"
      - "5011:5011"
      - "8087:8087"   # HTTP for serving assets

  # MailHog - Local development/testing SMTP server (host:mailhog, SMTP:1025, UI:8025)
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    networks:
      mongo-nw: {}
    ports:
      - "11025:1025"
      - "8025:8025"

  hdeu-auth:
