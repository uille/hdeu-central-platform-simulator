        max-size: "50m"
    container_name: hdeu-hub-ui
    build: ../hdeu-hub-ui # the location of the Dockerfile for the project (local f/s where the project is cloned)
    environment:
      - JAVA_OPTS=-Xms300m -Xmx1g
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:?}
      - VITE_API_HUB_URL=${VITE_API_HUB_URL:?}
      - VITE_API_QUALITY_BASE_URL=${VITE_API_QUALITY_BASE_URL:?}
